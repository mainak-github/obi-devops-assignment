name: Validate and deploy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate, build, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npm run check
      - run: npm run build
      - run: npm ci
        working-directory: infrastructure
      - run: npm run build && npm test -- --runInBand && npx cdk synth -c stage=ci
        working-directory: infrastructure
      - run: docker build --platform linux/amd64 -t backend:${{ github.sha }} ./backend
      - run: docker build --platform linux/amd64 -t frontend:${{ github.sha }} ./frontend

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      STAGE: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      STACK_NAME: ${{ github.ref_name == 'main' && 'ObiDevopsThreeTierStack' || 'ObiDevopsThreeTierStack-staging' }}
      IMAGE_TAG: ${{ github.sha }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: infrastructure
      - name: Check deployment configuration
        run: |
          test -n "$AWS_REGION" && test -n "$AWS_ACCOUNT_ID" && test -n "$AWS_ROLE_ARN" && test -n "$APP_URL"
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Provision stage repositories and infrastructure
        run: |
          if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            npx cdk deploy "$STACK_NAME" -c stage="$STAGE" --require-approval never
          fi
        working-directory: infrastructure
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - name: Build and push images
        run: |
          for service in backend frontend; do
            suffix="-$STAGE"
            if [ "$STAGE" = production ]; then suffix=""; fi
            repository="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/obi-devops-$service$suffix"
            docker build --platform linux/amd64 -t "$repository:$IMAGE_TAG" "./$service"
            docker push "$repository:$IMAGE_TAG"
          done
      - name: Deploy stage infrastructure and services
        run: |
          npx cdk deploy "$STACK_NAME" \
            -c stage="$STAGE" -c servicesEnabled=true -c imageTag="$IMAGE_TAG" --require-approval never
        working-directory: infrastructure
      - name: Verify deployed application
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$APP_URL/ready" && curl --fail --silent "$APP_URL/api/health"; then
              echo "Application is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Application health checks failed." >&2
          exit 1
