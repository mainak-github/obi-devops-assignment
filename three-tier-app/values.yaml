nameOverride: ""
fullnameOverride: ""

postgres:
  image: postgres:16-alpine
  storage: 1Gi
  username: appuser
  password: ""
  database: appdb

backend:
  image: obi-devops-backend:local
  pullPolicy: IfNotPresent
  replicas: 2
  port: 3000
  args: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  probePath: /

frontend:
  image: obi-devops-frontend:local
  pullPolicy: IfNotPresent
  replicas: 1
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: three-tier-app.local

networkPolicy:
  enabled: true
